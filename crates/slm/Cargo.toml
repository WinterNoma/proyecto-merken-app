[package]
name = "merken-slm"
description = "Asistente SLM en el dispositivo (interpretar y explicar), detrás de un trait"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Motor real con llama.cpp (Fase 1). Desactivado por defecto: sin él el crate
# solo trae el contrato, el control y el MockEngine.
llama = ["dep:llama-cpp-2"]

[dependencies]
merken-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
llama-cpp-2 = { version = "=0.1.161", optional = true }

[lints]
workspace = true

[[example]]
name = "v5_parity"
required-features = ["llama"]

[[example]]
name = "granite_eval"
required-features = ["llama"]
