[package]
name = "pulsys-sync"
description = "Cliente de la API de sincronización con Tierra"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pulsys-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# Sin TLS: la API de simulación es HTTP. Para el backend real (HTTPS) habrá que
# activar la característica `rustls`.
ureq = { version = "3", default-features = false, features = ["json"] }

