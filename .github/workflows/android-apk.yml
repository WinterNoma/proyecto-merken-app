name: Android APK

on:
  pull_request:
    branches: [desarrollo]
  push:
    branches: [desarrollo]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      CI: 'true'
      CARGO_TERM_COLOR: always
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx3g
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      LLAMA_LIB_PROFILE: Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and pinned NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Prepare Rust Android target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: native-slim-v7-1
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Test Rust domain and adapters with synthetic fixtures
        run: cargo test --locked -p merken-core -p merken-store -p merken-sync -p merken-seed -p merken-slm
      - name: Initialize Android project
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build installable ARM64 debug APK
        run: npm run tauri -- android build --ci --debug --apk --target aarch64
      - uses: aws-actions/configure-aws-credentials@v4
        if: github.event_name != 'pull_request'
        with:
          role-to-assume: ${{ secrets.SLM_BUILD_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: merken-apk-models-${{ github.run_id }}
      - name: Verify APK signature and export
        env:
          SLM_ASSET_BUCKET: ${{ secrets.SLM_ASSET_BUCKET }}
          TRUSTED_MODEL_BUILD: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p artifacts
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          python3 .github/scripts/bundle_offline_models.py "${apks[0]}" artifacts/merken-arm64-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/merken-arm64-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/merken-arm64-debug.apk > artifacts/apk-info.txt
          (cd artifacts && sha256sum merken-arm64-debug.apk > SHA256SUMS.txt)
          printf '%s\n' "$GITHUB_SHA" > artifacts/source-revision.txt
          if [[ "${{ github.event_name }}" != pull_request ]]; then
            python3 - <<'PY'
          import zipfile,hashlib
          with zipfile.ZipFile('artifacts/merken-arm64-debug.apk') as apk:
              for name,expected in [('space-health-base-Q4_K_M.gguf','4fce4f8510d16a058a9e6eef90d6ffd992135259e0fcadd42e69b06d1243dea1'),('wellbeing-v7-lora-f16.gguf','521290d5207de280a7fc1ebc7517138e2dd994405347cc451a16fa60d5ffc2ef')]:
                  with apk.open('assets/slm/'+name) as stream:
                      assert hashlib.file_digest(stream,'sha256').hexdigest()==expected
          PY
            echo 'Models embedded and APK asset hashes verified. Offline inference uses native llama.cpp plus the V7 adapter. Backend synchronization is optional and requires the ground-station login. Debug APK, not clinically validated; physical-device validation remains pending.' > artifacts/README.txt
          else
            echo 'PR compile-check APK only: model assets are not included. Use the trusted workflow-dispatch artifact for the complete offline app.' > artifacts/README.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: merken-android-arm64-debug-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
