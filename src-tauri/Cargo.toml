[package]
name = "merken"
description = "Merken: monitoreo de salud para astronautas (NASA Space Apps 2026)"
authors = ["Equipo Merken"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# El sufijo `_lib` evita el choque de nombres entre lib y bin en Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "merken_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
merken-core.workspace = true
merken-store.workspace = true
