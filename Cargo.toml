[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/store",
    "crates/seed",
    "crates/sync",
    "crates/slm",
    "crates/voice",
    "crates/api",
]
exclude = ["src-tauri", "plugins/slm-assets", "crates/local-speech"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/WinterNoma/proyecto-merken-app"

[workspace.dependencies]
pulsys-api = { path = "crates/api" }
pulsys-core = { path = "crates/core" }
pulsys-store = { path = "crates/store" }
pulsys-sync = { path = "crates/sync" }
pulsys-slm = { path = "crates/slm" }
pulsys-seed = { path = "crates/seed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
uuid = { version = "1", features = ["v7", "std"] }
sha2 = "0.10"
proptest = "1"

# RNF-01: en los crates del núcleo no se permite nada que pueda entrar en pánico.
# Los crates de crates/* lo activan con `[lints] workspace = true`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
